name: Validate retained native artifacts
on:
  workflow_call:
    inputs:
      source_run:
        description: Same-repository CI run whose selected native jobs passed
        type: string
        required: true
      hosts:
        description: Retained platform pair to validate without rebuilding workers
        type: string
        required: true
      refresh_coordinator:
        description: Build and test the current CLI; required if coordinator source changed
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  retained-native:
    if: github.ref == 'refs/heads/0.2.0' && !github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.hosts == 'macos' && '["macos-15","macos-15-intel"]' || '["windows-2025","windows-11-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
          architecture: ${{ (contains(matrix.runner, 'arm') || matrix.runner == 'macos-15') && 'arm64' || 'x64' }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          architecture: ${{ (contains(matrix.runner, 'arm') || matrix.runner == 'macos-15') && 'arm64' || 'x64' }}
      - name: Authenticate producer and unchanged runtime inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_RUNNER: ${{ matrix.runner }}
          REFRESH_COORDINATOR: ${{ inputs.refresh_coordinator }}
        run: python tests/interfaces/packaging/native-ci/scripts/reuse_provenance.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-candidate-${{ runner.os }}-${{ runner.arch }}
          path: tests/interfaces/packaging/native-ci/downloads
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - name: Pinned Rust for changed coordinator only
        if: inputs.refresh_coordinator
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Use Git Bash for Windows shell-syntax tests
        if: runner.os == 'Windows' && inputs.refresh_coordinator
        shell: pwsh
        run: |
          $gitBin = 'C:\Program Files\Git\bin'
          if (-not (Test-Path "$gitBin\bash.exe")) { throw 'Git Bash is required for completion syntax checks' }
          Add-Content -Path $env:GITHUB_ENV -Value "SVM_REPLAY_TEST_BASH=$gitBin\bash.exe"
      - name: Check retained inputs, changed SDK and affected coordinator
        run: python tests/interfaces/packaging/native-ci/scripts/reuse_candidate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-native-${{ runner.os }}-${{ runner.arch }}
          path: |
            tests/interfaces/packaging/native-ci/reports/*.log
            tests/interfaces/packaging/native-ci/reports/*summary.json
            tests/interfaces/packaging/native-ci/reports/updated/*
            tests/interfaces/packaging/native-ci/reports/sdk-current/*.tgz
            tests/interfaces/packaging/native-ci/reports/coordinator/*
            tests/interfaces/packaging/native-ci/reports/native-sessions/*.log
            tests/interfaces/packaging/native-ci/reports/native-sessions/summary.json
          retention-days: 1
          if-no-files-found: error
