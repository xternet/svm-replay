name: Reviewed tool platform qualification
on:
  workflow_dispatch:
    inputs:
      mac_only:
        description: Retain the separate qualified WSL browser result
        type: boolean
        default: false
      reuse_mac_run:
        description: Same-repository run holding source-pinned tool binaries (no rebuild)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-aarch64
            artifact: retained-native-macOS-ARM64
          - os: macos-15-intel
            platform: macos-x86_64
            artifact: retained-native-macOS-X64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      ANCHOR_SOURCE: ${{ github.workspace }}/anchor
      TOOL_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: xternet/surfpool
          ref: 33262045b129d2c722178b8436035cc957d44bee
          path: surfpool
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: xternet/anchor
          ref: 288cca71a754556debde34b7c465092dbe5f84da
          path: anchor
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Initialize private job paths
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/tool-target" >> "$GITHUB_ENV"
          echo "TOOL_WORK=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
          echo "STUDIO_UI_DIST=$RUNNER_TEMP/tools/studio.zip" >> "$GITHUB_ENV"
          echo "SURFPOOL_BIN=$RUNNER_TEMP/tool-builds/surfpool" >> "$GITHUB_ENV"
          echo "ANCHOR_BIN=$RUNNER_TEMP/tool-builds/anchor" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_ROOT=$RUNNER_TEMP/browser" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: xternet/svm-replay
          run-id: 39789180250
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/native
      - name: Verify selected inputs and install without rebuilding workers
        env:
          TOOL_PLATFORM: ${{ matrix.platform }}
        run: python tests/interfaces/integrations/tools/prepare.py "$TOOL_PLATFORM" "$RUNNER_TEMP/native" "$TOOL_WORK"
      - name: Build the reviewed tool sources and original historical SDK tests
        if: inputs.reuse_mac_run == ''
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          export RUSTUP_TOOLCHAIN=1.97.1
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/tool-source --remap-path-prefix=$RUNNER_TEMP=/build-output --remap-path-prefix=$HOME=/runner"
          cargo build --locked --manifest-path surfpool/Cargo.toml -p surfpool-cli --bin surfpool
          cargo test --locked --manifest-path surfpool/Cargo.toml -p surfpool-sdk --test historical --no-run --message-format=json > "$TOOL_WORK/sdk-build.jsonl"
          cargo build --locked --manifest-path anchor/Cargo.toml -p anchor-cli --bin anchor
          cargo test --locked --manifest-path anchor/Cargo.toml -p anchor-cli --lib
          python tests/interfaces/integrations/tools/builds.py save "$RUNNER_TEMP/tool-builds"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.reuse_mac_run == ''
        with:
          name: tool-builds-${{ matrix.platform }}
          path: ${{ runner.temp }}/tool-builds/*
          retention-days: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.reuse_mac_run != ''
        with:
          github-token: ${{ github.token }}
          repository: xternet/svm-replay
          run-id: ${{ inputs.reuse_mac_run }}
          name: tool-builds-${{ matrix.platform }}
          path: ${{ runner.temp }}/tool-builds
      - name: Verify tool bytes and install the browser
        run: |
          python tests/interfaces/integrations/tools/builds.py verify "$RUNNER_TEMP/tool-builds"
          npm install --prefix "$PLAYWRIGHT_ROOT" --no-audit --no-fund playwright@1.56.1
          "$PLAYWRIGHT_ROOT/node_modules/.bin/playwright" install chromium
      - name: Real transactions, Anchor tests and rendered Studio under a network sandbox
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN=1.97.1
          export PATH="$(dirname "$SURFPOOL_BIN"):$PATH"
          export HISTORICAL_TEST_BINARY
          HISTORICAL_TEST_BINARY="$RUNNER_TEMP/tool-builds/historical"
          python tests/interfaces/integrations/tools/sandbox.py
          sandbox-exec -p '(version 1)(allow default)(deny network-outbound)(allow network-outbound (remote ip "localhost:*"))(allow network-outbound (remote unix-socket))' node tests/interfaces/integrations/tools/run.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-qualification-${{ matrix.platform }}
          path: ${{ runner.temp }}/tools/reports/*
          retention-days: 1
  wsl-browser:
    if: ${{ !inputs.mac_only }}
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: xternet/svm-replay
          run-id: 39780040931
          name: native-candidate-Linux-X64
          path: ${{ runner.temp }}/native
      - name: Render Studio in actual WSL2 Chromium
        run: python tests/interfaces/integrations/tools/wsl.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tool-qualification-wsl2-browser
          path: ${{ runner.temp }}/wsl-tool-reports/*
          retention-days: 1
