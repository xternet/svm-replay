name: WSL2 candidate consumer
on:
  workflow_call:
    inputs:
      probe:
        description: Availability only; never a native qualification result
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  wsl:
    name: ${{ inputs.probe && 'WSL2 availability only' || 'WSL2 native consumer' }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ !inputs.probe }}
        with:
          name: native-candidate-Linux-X64
          path: ${{ runner.temp }}/svm-native-download
      - name: Actual WSL2 availability or downloaded-candidate checks
        env:
          SVM_REPLAY_WSL_PROBE: ${{ inputs.probe }}
        run: python tests/interfaces/packaging/native-ci/scripts/wsl_consumer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wsl2-consumer
          path: tests/interfaces/packaging/native-ci/reports/wsl/*
          retention-days: 1
