[package]
name = "svm-replay-engine"
version = "0.1.0"
license = "Apache-2.0"
description = "Historical Solana reconstruction, simulation and verification engine"
edition = "2021"
publish = ["crates-io"]
rust-version = "1.94"
authors = ["xternet"]
repository = "https://github.com/xternet/svm-replay"
homepage = "https://github.com/xternet/svm-replay"
documentation = "https://docs.rs/svm-replay-engine"
readme = "../../README.md"
keywords = ["solana", "svm", "replay", "simulation", "debugging"]
autotests = false

[dependencies]
svm-replay-protocol = { path = "../protocol", version = "=0.1.0" }
svm-replay-store = { path = "../store", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision", "raw_value"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
bs58 = "=0.5.1"
bincode = "=1.3.3"
solana-vote-interface = { version = "=2.2.6", features = ["bincode"] }
libc = "=0.2.183"
tempfile = "=3.27.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
object = { version = "=0.36.7", default-features = false, features = ["read_core", "elf", "std"] }
gimli = { version = "=0.31.1", default-features = false, features = ["read", "std", "endian-reader"] }
addr2line = { version = "=0.24.2", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=9.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
tokio = { version = "=1.53.1", features = ["rt", "process", "io-util", "time", "macros"] }

[lib]
path = "mod.rs"

